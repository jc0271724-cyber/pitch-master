<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Card Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Abstract Sound Wave Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#312e81" stroke-width="4" stroke-dasharray="10 15" opacity="0.4" />
  <circle cx="256" cy="256" r="220" fill="none" stroke="#4f46e5" stroke-width="2" stroke-dasharray="5 10" opacity="0.2" />

  <!-- Voice Soundwaves -->
  <g filter="url(#glow)">
    <!-- Behind notes, showing pitch matching wave -->
    <path d="M 120 256 Q 160 216 200 256 T 280 256 T 360 256 T 440 256" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" opacity="0.8" />
    <path d="M 80 256 Q 140 176 200 256 T 320 256 T 440 256" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- Sleek Music Note Emblem -->
  <g transform="translate(196, 120)" filter="url(#glow)">
    <!-- Double Eighth Note -->
    <path d="M 30 160 
             C 30 130, 80 130, 80 160 
             C 80 190, 30 190, 30 160 Z" fill="#ffffff" />
    <path d="M 95 160 
             C 95 130, 145 130, 145 160 
             C 145 190, 95 190, 95 160 Z" fill="#ffffff" />
    <path d="M 70 160 L 70 30 L 135 45 L 135 160" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 70 30 L 135 45 L 135 10 L 70 0 Z" fill="url(#accentGrad)" opacity="0.9" />
  </g>
</svg>
